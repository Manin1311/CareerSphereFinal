services:
  - type: web
    name: careersphere-backend
    env: python
    region: oregon
    pythonVersion: "3.11.9"
    buildCommand: "./build.sh"
    startCommand: "gunicorn careersphere_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --preload --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
