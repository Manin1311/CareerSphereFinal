<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cs-planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cs-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Back arc of orbital ring -->
  <path d="M 14,54 A 40,15 -25 0,1 86,46" stroke="url(#cs-ring-grad)" stroke-width="7" stroke-linecap="round" opacity="0.45" />

  <!-- Main Planet Body -->
  <circle cx="50" cy="50" r="30" fill="url(#cs-planet-grad)" />

  <!-- Gloss Highlight -->
  <ellipse cx="40" cy="38" rx="9" ry="6" transform="rotate(-20 40 38)" fill="#ffffff" opacity="0.35" />

  <!-- Front arc of orbital ring (wraps around front) -->
  <path d="M 86,46 A 40,15 -25 0,1 14,54" stroke="url(#cs-ring-grad)" stroke-width="8" stroke-linecap="round" />
</svg>
